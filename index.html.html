/* Layout: single-column app shell, sticky header with a glazed-tile band (Residence of ChNU roof), lessons as time-rail cards */
:root{
  --bg:#f1f3f0; --surface:#ffffff; --sunk:#e5e9e4; --ink:#17201b; --muted:#5a6660; --line:#d2d9d2;
  --brick:#9b3324; --brick-soft:#f4e2dd; --tile:#1c5a47; --tile-soft:#dcebe4; --gold:#a97a22; --gold-soft:#f5ead2;

  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#19201c; --sunk:#222b26; --ink:#e7ece8; --muted:#9aa8a0; --line:#2f3a34;
  --brick:#e2735f; --brick-soft:#3a221d; --tile:#62b89c; --tile-soft:#1b322a; --gold:#d9ad55; --gold-soft:#33291a;
  --bad:#ff8a80; --bad-soft:#3b1f1c; --focus:#62b89c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#19201c; --sunk:#222b26; --ink:#e7ece8; --muted:#9aa8a0; --line:#2f3a34;
  --brick:#e2735f; --brick-soft:#3a221d; --tile:#62b89c; --tile-soft:#1b322a; --gold:#d9ad55; --gold-soft:#33291a;
  --bad:#ff8a80; --bad-soft:#3b1f1c; --focus:#62b89c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tiles{height:8px;background:
  linear-gradient(135deg,var(--tile) 25%,transparent 25%) -6px 0/12px 8px,
  linear-gradient(225deg,var(--tile) 25%,transparent 25%) -6px 0/12px 8px,
  linear-gradient(315deg,var(--brick) 25%,transparent 25%) 0 0/12px 8px,
  linear-gradient(45deg,var(--brick) 25%,var(--gold) 25%) 0 0/12px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--brick)}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12px;color:var(--muted);text-align:right}
nav{display:flex;gap:4px;padding-block:0 10px}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 6px;border-radius:8px}
nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}

main{padding-block:16px 48px;display:grid;gap:16px}

/* controls */
.controls{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
@media (max-width:520px){.controls{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--tile)}
.hint{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted);min-height:1.2em}
.hint strong{color:var(--ink)}
.hint .el{color:var(--tile);font-weight:600}

/* week bar */
.weekbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--ink);color:var(--surface)}
.weekbar .eyebrow{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.weekbar strong{font-family:var(--f-display);font-weight:500;font-size:17px}
.seg{display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 14%,transparent);padding:3px;border-radius:9px}
.seg button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.1;text-align:left}
.seg button small{display:block;font-weight:400;font-size:11px;opacity:.75}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.seg button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:5px;vertical-align:middle}

/* day chips */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days button{flex:1 0 auto;min-width:52px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;cursor:pointer;display:grid;justify-items:center;gap:1px}
.days button b{font-size:14px}
.days button span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"]{border-color:var(--tile);background:var(--tile-soft)}
.days button.today b{color:var(--brick)}

/* today summary */
.today{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;padding:10px 14px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.today b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.today .live{color:var(--brick);font-weight:600}

.dayhead{font-family:var(--f-display);font-weight:500;font-size:15px;margin:8px 0 0;display:flex;justify-content:space-between;align-items:baseline}
.dayhead small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.list{display:grid;gap:0}

/* lesson */
.lesson{display:grid;grid-template-columns:74px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r);padding:12px 14px 12px 10px}
.lesson + .lesson.par{margin-top:6px}
.t-L{--c:var(--tile);--cs:var(--tile-soft)} .t-P{--c:var(--gold);--cs:var(--gold-soft)} .t-Lab{--c:var(--brick);--cs:var(--brick-soft)}
.time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;display:grid;align-content:start;gap:1px}
.time b{font-size:17px}
.time span{font-size:13px;color:var(--muted)}
.time i{font-style:normal;font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.body{min-width:0}
.body h3{margin:4px 0 2px;font-size:16px;font-weight:600;line-height:1.25;text-wrap:balance}
.meta{margin:0;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);letter-spacing:.02em}
.chip.type{background:var(--cs);color:var(--c)}
.chip.el{background:var(--ink);color:var(--surface)}
.chip.wk{border:1px solid var(--line);background:transparent}
.lesson.now{box-shadow:0 0 0 2px var(--brick)}
.lesson.past{opacity:.55}
.status{font-size:12px;font-weight:600;color:var(--brick);margin-top:6px}
.gap{display:flex;align-items:center;gap:8px;padding:6px 0 6px 28px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.gap::before{content:"";width:2px;height:18px;background:var(--line);border-radius:2px}
.gap.window{color:var(--gold);font-weight:700}
.gap.window::before{background:var(--gold);height:28px}
.parnote{font-size:12px;color:var(--muted);margin:2px 0 4px 2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* admin */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.card h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--tile);border-color:var(--tile);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--tile);border-color:var(--tile);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rows{display:grid;gap:6px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;background:var(--surface)}
.arow .mono{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.arow .t{min-width:0}
.arow .t b{display:block;font-weight:600;font-size:14px}
.arow .t span{font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px}
.alert{padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13px}
.alert ul{margin:4px 0 0;padding-left:18px}
.note{font-size:13px;color:var(--muted);margin:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.c,th.c{text-align:center}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk)}
.pill.owner{background:var(--brick-soft);color:var(--brick)}
.log{font-size:13px;display:grid;gap:6px}
.log div{display:grid;grid-template-columns:auto 1fr;gap:10px}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:20}
footer{font-size:12px;color:var(--muted);text-align:center;padding-block:0 24px}
@media (prefers-reduced-motion:no-preference){.lesson{transition:box-shadow .2s}}
</style>

  const fw=S.firstWeek||'even';return {n,parity:n%2?fw:(fw==='odd'?'even':'odd')};
}
function todayDay(){const d=now().getDay();return d>=1&&d<=6?d:0}

/* ===== Вибірка ===== */
function lessonsFor({groupId,teacherId,student,parity,day}){
  return S.lessons.filter(l=>l.day===day&&(l.week==='both'||l.week===parity)
    &&(!groupId||l.groups.includes(groupId))&&(!teacherId||l.teacher===teacherId)
    &&(!l.elective||!student||student.electives.includes(l.elective)))
   .sort((a,b)=>a.pair-b.pair||a.subject.localeCompare(b.subject));
}
function slotsOf(list){const m=new Map();list.forEach(l=>{if(!m.has(l.pair))m.set(l.pair,[]);m.get(l.pair).push(l)});return [...m.entries()]}

/* ===== Картки пар ===== */
function lessonCard(l,mode,cls,status){
  const [a,b]=PAIRS[l.pair];
  const chips=[`<span class="chip type">${TYPES[l.type]}</span>`];
  if(l.week!=='both')chips.push(`<span class="chip wk">${WEEKS[l.week].toLowerCase()} тиждень</span>`);
  if(l.elective)chips.push(`<span class="chip el">вибіркова</span>`);
  const meta=mode==='teacher'
    ?`Групи <b>${esc(gNames(l.groups))}</b> · ${esc(l.room)}`
    :`<b>${esc(tShort(l.teacher))}</b>${l.room?' · '+esc(l.room):''}${l.groups.length>1?' · потік '+esc(gNames(l.groups)):''}`;
  return `<article class="lesson t-${l.type} ${cls||''}">
    <div class="time"><b>${a}</b><span>${b}</span><i>${l.pair} пара</i></div>
    <div class="body"><div class="chips">${chips.join('')}</div><h3>${esc(l.subject)}</h3><p class="meta">${meta}</p>${status?`<div class="status">${status}</div>`:''}</div>
  </article>`;
}
function dayList(list,mode,live){
  if(!list.length)return `<div class="empty">Пар немає — вільний день.</div>`;
  const slots=slotsOf(list),nm=now().getHours()*60+now().getMinutes();
  let h='',prevEnd=null;
  slots.forEach(([pair,ls])=>{
    const s=toMin(PAIRS[pair][0]),e=toMin(PAIRS[pair][1]);
    if(prevEnd!==null){const g=s-prevEnd;h+=`<div class="gap ${g>30?'window':''}">${g>30?'вікно '+dur(g):'перерва '+g+' хв'}</div>`}
    let cls='',status='';
    if(live){
      if(nm>=s&&nm<e){cls='now';status=`Йде зараз · до кінця ${dur(e-nm)}`}
      else if(nm>=e)cls='past';
      else if(slots.find(([p])=>toMin(PAIRS[p][0])>nm)?.[0]===pair)status=`Почнеться через ${dur(s-nm)}`;
    }
    if(ls.length>1&&mode==='student')h+=`<div class="parnote">Паралельні вибіркові — вкажіть себе вгорі, щоб бачити лише свою</div>`;
    ls.forEach((l,i)=>{h+=lessonCard(l,mode,cls+(i?' par':''),i?'':status)});
    prevEnd=e;
  });
  return `<div class="list">${h}</div>`;
}
function daySummary(list){
  if(!list.length)return '';
  const slots=slotsOf(list),first=PAIRS[slots[0][0]][0],last=PAIRS[slots[slots.length-1][0]][1];
  let win=0;for(let i=1;i<slots.length;i++){const g=toMin(PAIRS[slots[i][0]][0])-toMin(PAIRS[slots[i-1][0]][1]);if(g>30)win+=g}
  const nm=now().getHours()*60+now().getMinutes();
  let live='';
  if(nm<toMin(first))live=`Перша пара через <b>${dur(toMin(first)-nm)}</b>`;
  else if(nm>=toMin(last))live='Пари на сьогодні закінчились';
  return `<div class="today"><span>Сьогодні <b>${slots.length}</b> ${plural(slots.length,'пара','пари','пар')}</span><span><b>${first}–${last}</b></span>${win?`<span>вікна: <b>${dur(win)}</b></span>`:''}${live?`<span class="live">${live}</span>`:''}</div>`;
}

/* ===== Тиждень + дні (спільне для студента та викладача) ===== */
function weekBlock(filter,mode){
  const wi=weekInfo(); if(!V.parity)V.parity=wi.parity;
  const td=todayDay(); if(V.day===null)V.day=td||1;
  const isCur=V.parity===wi.parity;
  const count=d=>slotsOf(lessonsFor({...filter,parity:V.parity,day:d})).length;
  let h=`<div class="weekbar"><div><span class="eyebrow">${isCur?'Зараз · тиждень '+wi.n:'Перегляд іншого тижня'}</span><strong>${V.parity==='odd'?'Непарний (чисельник)':'Парний (знаменник)'}</strong></div>
    <div class="seg" role="group" aria-label="Тиждень">
      <button data-act="parity" data-v="odd" aria-pressed="${V.parity==='odd'}">Непарний${wi.parity==='odd'?'<span class="dot" title="поточний"></span>':''}<small>чисельник</small></button>
      <button data-act="parity" data-v="even" aria-pressed="${V.parity==='even'}">Парний${wi.parity==='even'?'<span class="dot" title="поточний"></span>':''}<small>знаменник</small></button>
    </div></div>`;
  h+=`<div class="days" role="group" aria-label="День">`;
  for(let d=1;d<=6;d++){const c=count(d);if(d===6&&!c)continue;
    h+=`<button data-act="day" data-v="${d}" aria-pressed="${V.day===d}" class="${isCur&&d===td?'today':''}"><b>${DSHORT[d]}</b><span>${c} ${plural(c,'пара','пари','пар')}</span></button>`}
  h+=`<button data-act="day" data-v="0" aria-pressed="${V.day===0}"><b>Тиждень</b><span>усі дні</span></button></div>`;
  if(V.day===0){
    for(let d=1;d<=6;d++){const list=lessonsFor({...filter,parity:V.parity,day:d});if(d===6&&!list.length)continue;
      h+=`<h2 class="dayhead">${DAYS[d]}<small>${list.length?PAIRS[list[0].pair][0]+'–'+PAIRS[list[list.length-1].pair][1]:''}</small></h2>${dayList(list,mode,isCur&&d===td)}`}
  }else{
    const list=lessonsFor({...filter,parity:V.parity,day:V.day});const live=isCur&&V.day===td;
    h+=(live?daySummary(list):`<h2 class="dayhead">${DAYS[V.day]}</h2>`)+dayList(list,mode,live);
  }
  return h;
}

/* ===== Студент ===== */
function findStudent(groupId,q){
  q=norm(q);if(q.length<3)return {match:null,many:false};
  const c=S.students.filter(s=>s.groupId===groupId&&(norm(s.name).startsWith(q)||norm(initials(s.name)).startsWith(q)));
  return {match:c.length===1?c[0]:(c.find(s=>norm(initials(s.name))===q)||null),many:c.length>1};
}
function groupOptions(sel){
  const courses=[...new Set(S.groups.map(g=>g.course))].sort((a,b)=>(a||9)-(b||9));
  return courses.map(c=>`<optgroup label="${c?c+' курс':'Інші групи'}">${S.groups.filter(g=>g.course===c).map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.name)}${g.spec?' — '+esc(g.spec):''}</option>`).join('')}</optgroup>`).join('');
}
function renderStudent(){
  if(!G(pref.group))pref.group='g93';
  const names=S.students.filter(s=>s.groupId===pref.group).map(s=>`<option value="${esc(initials(s.name))}"></option>`).join('');
  $('#app').innerHTML=`<section class="controls">
    <label class="field"><span>Група</span><select id="sGroup">${groupOptions(pref.group)}</select></label>
    <label class="field"><span>Прізвище та ініціали</span><input id="sName" list="sNames" placeholder="напр. Андрієць М. В." autocomplete="off" value="${esc(pref.name||'')}"><datalist id="sNames">${names}</datalist></label>
    <p class="hint" id="sHint"></p></section><div id="results" style="display:grid;gap:12px"></div>`;
  renderStudentResults();
}
function renderStudentResults(){
  const {match,many}=findStudent(pref.group,pref.name);
  const hint=$('#sHint');
  if(match){const els=match.electives.map(E).filter(Boolean);
    hint.innerHTML=`<strong>${esc(match.name)}</strong> · вибіркові: ${els.length?els.map(e=>`<span class="el">${esc(e.name)}</span>`).join(', '):'не обрано'}`}
  else if(many)hint.textContent='Знайдено кількох студентів — допишіть ініціали.';
  else if(!S.students.some(s=>s.groupId===pref.group))hint.textContent='Список студентів цієї групи ще не внесено. Показано повний розклад групи.';
  else if(norm(pref.name).length>=3)hint.textContent='Такого студента в групі немає. Показано всі вибіркові групи.';
  else hint.textContent='Введіть прізвище та ініціали, щоб бачити лише свої вибіркові дисципліни.';
  $('#results').innerHTML=weekBlock({groupId:pref.group,student:match},'student');
}

function readForm(){
  const x=V.editing;
  x.subject=$('#fSubject').value.trim();x.type=$('#fType').value;x.teacher=$('#fTeacher').value;x.room=$('#fRoom').value.trim();
  x.day=+$('#fDay').value;x.pair=+$('#fPair').value;x.week=$('#fWeek').value;x.elective=$('#fElective').value;
  x.groups=[...document.querySelectorAll('.fGroup:checked')].map(i=>i.value);
}
const overlap=(a,b)=>a==='both'||b==='both'||a===b;
function conflicts(x){
  const out=[];
  S.lessons.forEach(l=>{
    if(l.id===x.id||l.day!==x.day||l.pair!==x.pair||!overlap(l.week,x.week))return;
    const what=`${l.subject} (${gNames(l.groups)}, ${WEEKS[l.week].toLowerCase()})`;
    if(x.teacher&&l.teacher===x.teacher)out.push(`${tShort(x.teacher)} вже веде: ${what}`);
    if(x.room&&l.room&&norm(l.room)===norm(x.room))out.push(`${x.room} зайнята: ${what}`);
    const shared=l.groups.filter(g=>x.groups.includes(g));
    if(shared.length&&!(x.elective&&l.elective&&x.elective!==l.elective))out.push(`Група ${gNames(shared)} вже має пару: ${what}`);
  });
  return out;
}
function submitLesson(){
  readForm();const x=V.editing;
  V.formError=!x.subject?'Вкажіть назву дисципліни.':(!x.groups.length?'Оберіть хоча б одну групу.':'');
  if(V.formError)return renderAdmin();
  const conf=conflicts(x);
  if(conf.length&&!V.force){V.force=true;return renderAdmin()}
  const {_new,...data}=x;
  if(_new){data.id=uid('l');S.lessons.push(data);logAction(`Додано: ${data.subject}, ${DSHORT[data.day]} ${data.pair} пара, гр. ${gNames(data.groups)}`)}
  else{const i=S.lessons.findIndex(l=>l.id===data.id);S.lessons[i]=data;logAction(`Змінено: ${data.subject}, ${DSHORT[data.day]} ${data.pair} пара, гр. ${gNames(data.groups)}`)}
  save();V.editing=null;V.force=false;toast('Розклад збережено');renderAdmin();
}

  return h;
}

    <label class="field"><span>Роль</span><select id="nRole"><option value="editor">Редактор — змінює розклад</option><option value="owner">Деканат — керує доступом</option></select></label></div>
    ${V.formError?`<div class="alert">${V.formError}</div>`:''}
    <button class="btn pri">Надати доступ</button></form>`;
}
function aSettings(){
  const wi=weekInfo();
  return `<form class="card" id="setForm"><h2>Семестр</h2>
    <div class="grid2"><label class="field"><span>Перший день семестру</span><input type="date" id="semStart" value="${S.semesterStart}"></label><label class="field"><span>Перший тиждень</span><select id="firstWeek"><option value="odd" ${S.firstWeek==='odd'?'selected':''}>Непарний</option><option value="even" ${(S.firstWeek||'even')==='even'?'selected':''}>Парний</option></select></label></div>
    <p class="note">Зараз тиждень ${wi.n}, ${wi.parity==='odd'?'непарний':'парний'}.</p><button class="btn pri">Зберегти</button></form>
  <div class="card"><h2>Групи та викладачі</h2>
    <form id="grpForm" class="grid2"><input id="gName" placeholder="Номер групи, напр. 243" required><select id="gCourse">${[1,2,3,4].map(c=>`<option value="${c}">${c} курс</option>`).join('')}</select><input id="gSpec" placeholder="Спеціальність" required><button class="btn pri">Додати групу</button></form>
    <form id="tchForm" class="row"><input id="tName" placeholder="Прізвище Імʼя По батькові" style="flex:1;min-width:200px" required><button class="btn pri">Додати викладача</button></form></div>
  <div class="card"><h2>Скидання</h2><p class="note">Повертає демонстраційні дані. Усі зміни буде втрачено.</p><div>${armBtn('reset','Скинути до демо-даних','Так, скинути все')}</div></div>`;
}
function aLog(){
  return `<div class="card"><h2>Журнал змін</h2>${S.log.length?`<div class="log">${S.log.map(r=>`<div><time>${new Date(r.t).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</time><span><b>${esc(r.who)}</b> — ${esc(r.what)}</span></div>`).join('')}</div>`:'<p class="note">Змін ще не було. Тут видно, хто і що змінив у розкладі.</p>'}</div>`;
}

/* ===== Роутинг ===== */
function route(){const r=(location.hash||'#student').slice(1);return ['student','teacher','admin'].includes(r)?r:'student'}
function render(){
  const r=route();
  document.querySelectorAll('#nav a').forEach(a=>{if(a.dataset.r===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#who').textContent=me?me.name:'';
  if(r==='student')renderStudent();else if(r==='teacher')renderTeacher();else renderAdmin();
}
addEventListener('hashchange',()=>{V.editing=null;V.armed=null;V.formError='';render()});

/* ===== Події ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.type==='checkbox')return;
  const a=b.dataset.act;
  if(a!=='arm')V.armed=null;
  if(a==='parity'){V.parity=b.dataset.v;return render()}
  if(a==='day'){V.day=+b.dataset.v;return render()}
  if(a==='atab'){V.adminTab=b.dataset.v;V.editing=null;V.formError='';return renderAdmin()}
  if(a==='logout'){me=null;try{sessionStorage.removeItem(KEY+'-me')}catch(_){}return render()}
  if(a==='add'){V.editing={_new:true,groups:[V.adminGroup],day:1,pair:1,week:'both',type:'L',subject:'',teacher:'',room:'',elective:''};V.force=false;V.formError='';renderAdmin();$('#fSubject')?.focus();return}
  if(a==='edit'){V.editing=JSON.parse(JSON.stringify(S.lessons.find(l=>l.id===b.dataset.id)));V.force=false;V.formError='';renderAdmin();$('#lessonForm')?.scrollIntoView({block:'center'});return}
  if(a==='cancel'){V.editing=null;V.force=false;V.formError='';return renderAdmin()}
  if(a==='arm'){
    const k=b.dataset.k;
    if(V.armed!==k){V.armed=k;return renderAdmin()}
    V.armed=null;const [type,id]=k.split(/:(.*)/);
    if(type==='del'){const l=S.lessons.find(x=>x.id===id);S.lessons=S.lessons.filter(x=>x.id!==id);logAction(`Видалено: ${l.subject}, ${DSHORT[l.day]} ${l.pair} пара, гр. ${gNames(l.groups)}`);toast('Пару видалено')}
    if(type==='stu'){const s=S.students.find(x=>x.id===id);S.students=S.students.filter(x=>x.id!==id);logAction(`Видалено студента: ${s.name}`)}
    if(type==='adm'){S.admins=S.admins.filter(x=>x.login!==id);logAction(`Забрано доступ: ${id}`);toast('Доступ забрано')}
    if(type==='reset'){const keep=me;S=seed();me=S.admins.find(x=>x.login===keep.login)||null;logAction('Дані скинуто до демонстраційних');toast('Дані скинуто')}
    save();return render();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sGroup'){pref.group=t.value;pref.name='';savePref();return renderStudent()}
  if(t.id==='tSel'){pref.teacher=t.value;savePref();return renderTeacher()}
  if(t.id==='aGroup'){V.adminGroup=t.value;V.editing=null;return renderAdmin()}
  if(t.dataset.act==='enroll'){const s=S.students.find(x=>x.id===t.dataset.s),el=t.dataset.e;
    s.electives=t.checked?[...new Set([...s.electives,el])]:s.electives.filter(x=>x!==el);
    logAction(`${initials(s.name)}: ${t.checked?'записано на':'виписано з'} «${E(el).name}»`);toast('Збережено')}
});
document.addEventListener('input',e=>{if(e.target.id==='sName'){pref.name=e.target.value;savePref();renderStudentResults()}});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.id;
  if(f==='loginForm'){const a=S.admins.find(x=>x.login===$('#lLogin').value.trim()&&x.pass===$('#lPass').value);
    if(!a)return renderLogin('Невірний логін або пароль.');me=a;try{sessionStorage.setItem(KEY+'-me',a.login)}catch(_){}return render()}
  if(f==='lessonForm')return submitLesson();
  if(f==='stuForm'){const n=$('#newStu').value.trim().replace(/\s+/g,' ');if(!n)return;S.students.push({id:uid('s'),groupId:V.adminGroup,name:n,electives:[]});logAction(`Додано студента: ${n} (гр. ${G(V.adminGroup).name})`);toast('Студента додано');return renderAdmin()}
  if(f==='elForm'){const n=$('#newEl').value.trim();if(!n)return;S.electives.push({id:uid('e'),name:n,teacher:$('#newElT').value,course:G(V.adminGroup).course});logAction(`Нова вибіркова: ${n}`);toast('Дисципліну додано');return renderAdmin()}
  if(f==='admForm'){const login=$('#nLogin').value.trim();
    if(S.admins.some(a=>a.login===login)){V.formError='Такий логін уже існує.';return renderAdmin()}
    S.admins.push({name:$('#nName').value.trim(),login,pass:$('#nPass').value,role:$('#nRole').value});V.formError='';logAction(`Надано доступ: ${login}`);toast('Доступ надано');return renderAdmin()}
  if(f==='setForm'){S.semesterStart=$('#semStart').value||S.semesterStart;S.firstWeek=$('#firstWeek').value;V.parity=null;logAction(`Початок семестру: ${S.semesterStart}`);toast('Збережено');return renderAdmin()}
  if(f==='grpForm'){S.groups.push({id:uid('g'),name:$('#gName').value.trim(),course:+$('#gCourse').value,spec:$('#gSpec').value.trim()});logAction(`Нова група: ${$('#gName').value.trim()}`);toast('Групу додано');return renderAdmin()}
  if(f==='tchForm'){S.teachers.push({id:uid('t'),name:$('#tName').value.trim().replace(/\s+/g,' ')});logAction(`Новий викладач: ${$('#tName').value.trim()}`);toast('Викладача додано');return renderAdmin()}
});
setInterval(()=>{if(route()!=='admin'&&!document.activeElement?.matches('input,select'))render()},60000);
render();
</script>
